
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachable Machine Image AI</title>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 650px;
            padding: 35px;
            border-radius: 22px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.2);
            text-align: center;
        }

        .icon {
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            color: #4338ca;
            font-size: 27px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
            font-size: 15px;
        }

        .upload-box {
            border: 2px dashed #a5b4fc;
            border-radius: 16px;
            padding: 25px;
            background: #f8faff;
            margin-bottom: 20px;
        }

        .upload-box p {
            color: #555;
            margin-bottom: 15px;
        }

        input[type="file"] {
            width: 100%;
            padding: 12px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(99,102,241,0.3);
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
            transform: none;
        }

        #preview {
            display: none;
            max-width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 14px;
            margin: 20px auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .result-box {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #f5f3ff;
            border-radius: 15px;
            text-align: left;
        }

        .result-box h2 {
            text-align: center;
            color: #4338ca;
            margin-bottom: 18px;
        }

        .prediction {
            margin-bottom: 16px;
        }

        .prediction-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        .progress {
            width: 100%;
            height: 12px;
            background: #ddd;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #6366f1, #a78bfa);
            border-radius: 20px;
            transition: width 0.5s;
        }

        #status {
            margin-top: 15px;
            color: #666;
            font-size: 14px;
        }

        .footer {
            margin-top: 25px;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="icon">🤖</div>

    <h1>AI Image Classification</h1>

    <p class="subtitle">
        ระบบจำแนกประเภทภาพด้วย Teachable Machine
    </p>

    <div class="upload-box">
        <p>📁 กรุณาเลือกภาพที่ต้องการให้ AI วิเคราะห์</p>

        <input
            type="file"
            id="imageInput"
            accept="image/png, image/jpeg, image/jpg"
        />

        <img id="preview" alt="Image Preview">

        <button id="uploadBtn" onclick="predictImage()">
            🚀 Upload & Analyze
        </button>
    </div>

    <div id="status">กรุณาเลือกภาพเพื่อเริ่มต้นใช้งาน</div>

    <div class="result-box" id="resultBox">
        <h2>📊 ผลการวิเคราะห์ภาพ</h2>
        <div id="label-container"></div>
    </div>

    <div class="footer">
        Powered by TensorFlow.js & Teachable Machine
    </div>

</div>

<script>
    // Teachable Machine Model URL
    const URL = "https://teachablemachine.withgoogle.com/models/Zrya_ktnG/";

    let model = null;

    const imageInput = document.getElementById("imageInput");
    const preview = document.getElementById("preview");
    const uploadBtn = document.getElementById("uploadBtn");
    const statusText = document.getElementById("status");
    const resultBox = document.getElementById("resultBox");
    const labelContainer = document.getElementById("label-container");

    // ตรวจสอบไฟล์ภาพที่เลือก
    imageInput.addEventListener("change", function(event) {

        const file = event.target.files[0];

        resultBox.style.display = "none";
        labelContainer.innerHTML = "";

        if (!file) {
            preview.style.display = "none";
            return;
        }

        if (!file.type.startsWith("image/")) {
            statusText.textContent = "กรุณาเลือกไฟล์ภาพเท่านั้น";
            imageInput.value = "";
            preview.style.display = "none";
            return;
        }

        const reader = new FileReader();

        reader.onload = function(e) {
            preview.src = e.target.result;
            preview.style.display = "block";
            statusText.textContent = "เลือกรูปภาพเรียบร้อยแล้ว พร้อมวิเคราะห์";
        };

        reader.readAsDataURL(file);
    });

    // โหลด Model และทำนายภาพ
    async function predictImage() {

        if (!imageInput.files.length) {
            alert("กรุณาเลือกภาพก่อน Upload");
            return;
        }

        uploadBtn.disabled = true;
        uploadBtn.textContent = "⏳ กำลังวิเคราะห์...";
        statusText.textContent = "กำลังโหลด AI Model...";

        try {

            // โหลด Model เพียงครั้งเดียว
            if (!model) {
                const modelURL = URL + "model.json";
                const metadataURL = URL + "metadata.json";

                model = await tmImage.load(modelURL, metadataURL);
            }

            statusText.textContent = "กำลังประมวลผลภาพ...";

            // ทำนายภาพ
            const prediction = await model.predict(preview);

            // เรียงลำดับจากค่าความมั่นใจมากไปน้อย
            prediction.sort((a, b) =>
                b.probability - a.probability
            );

            // ล้างผลลัพธ์เดิม
            labelContainer.innerHTML = "";

            // แสดงผลลัพธ์
            prediction.forEach(item => {

                const percent = (item.probability * 100).toFixed(2);

                const predictionDiv = document.createElement("div");
                predictionDiv.className = "prediction";

                const info = document.createElement("div");
                info.className = "prediction-info";

                const name = document.createElement("span");
                name.textContent = item.className;

                const score = document.createElement("span");
                score.textContent = percent + "%";

                info.appendChild(name);
                info.appendChild(score);

                const progress = document.createElement("div");
                progress.className = "progress";

                const bar = document.createElement("div");
                bar.className = "progress-bar";
                bar.style.width = percent + "%";

                progress.appendChild(bar);

                predictionDiv.appendChild(info);
                predictionDiv.appendChild(progress);

                labelContainer.appendChild(predictionDiv);
            });

            resultBox.style.display = "block";

            statusText.textContent = "✅ วิเคราะห์ภาพสำเร็จแล้ว";

        } catch (error) {

            console.error(error);

            statusText.textContent =
                "เกิดข้อผิดพลาดในการวิเคราะห์ กรุณาลองใหม่";

        } finally {

            uploadBtn.disabled = false;
            uploadBtn.textContent = "🚀 Upload & Analyze";

        }
    }
</script>

</body>
</html>
