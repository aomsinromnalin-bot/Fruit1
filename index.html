
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachable Machine Image Classifier</title>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: #fff;
            border-radius: 25px;
            padding: 35px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.2);
            text-align: center;
        }

        .icon {
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            color: #333;
            font-size: 27px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #888;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .upload-area {
            border: 2px dashed #9b8af5;
            background: #f8f7ff;
            border-radius: 18px;
            padding: 30px 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .upload-area:hover {
            background: #eeebff;
            border-color: #764ba2;
        }

        .upload-area p {
            color: #666;
            margin-top: 10px;
        }

        input[type="file"] {
            display: none;
        }

        .upload-icon {
            font-size: 45px;
        }

        button {
            border: none;
            padding: 14px 30px;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 15px rgba(102,126,234,0.3);
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
            transform: none;
        }

        #preview {
            display: none;
            max-width: 100%;
            max-height: 300px;
            margin: 25px auto 10px;
            border-radius: 15px;
            object-fit: contain;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .result-box {
            display: none;
            margin-top: 25px;
            padding: 22px;
            background: #f8f7ff;
            border-radius: 18px;
            text-align: left;
        }

        .result-box h2 {
            text-align: center;
            color: #5b4bb7;
            margin-bottom: 20px;
        }

        .prediction {
            margin-bottom: 15px;
        }

        .prediction-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 7px;
            color: #444;
            font-size: 14px;
        }

        .progress {
            height: 12px;
            background: #e4e4e4;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 20px;
            transition: width 0.5s;
        }

        #status {
            color: #777;
            margin-top: 15px;
            font-size: 14px;
        }

        .footer {
            color: #aaa;
            font-size: 12px;
            margin-top: 25px;
        }

        @media(max-width: 500px) {
            .container {
                padding: 22px;
            }

            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="icon">🖼️</div>

    <h1>Teachable Machine</h1>

    <p class="subtitle">
        Image Classification System<br>
        อัปโหลดภาพเพื่อให้ AI วิเคราะห์และจำแนกประเภทภาพ
    </p>

    <!-- Upload Image -->
    <label class="upload-area" for="imageInput">
        <div class="upload-icon">📤</div>
        <h3>เลือกภาพที่ต้องการวิเคราะห์</h3>
        <p>คลิกเพื่อเลือกไฟล์ JPG, JPEG หรือ PNG</p>
    </label>

    <input type="file"
           id="imageInput"
           accept="image/jpeg,image/png,image/jpg">

    <!-- Preview -->
    <img id="preview" alt="Image Preview">

    <br>

    <button id="uploadBtn" onclick="uploadImage()" disabled>
        🔍 Upload & Predict
    </button>

    <p id="status">กรุณาเลือกภาพก่อนเริ่มวิเคราะห์</p>

    <!-- Results -->
    <div class="result-box" id="resultBox">
        <h2>📊 ผลการวิเคราะห์ภาพ</h2>
        <div id="label-container"></div>
    </div>

    <div class="footer">
        Powered by Teachable Machine & TensorFlow.js
    </div>

</div>

<script>
    // Teachable Machine Model URL
    const URL = "https://teachablemachine.withgoogle.com/models/Zrya_ktnG/";

    let model;
    let selectedImage = null;

    // Load model
    async function loadModel() {
        const status = document.getElementById("status");

        try {
            status.innerText = "กำลังโหลด AI Model...";

            model = await tmImage.load(
                URL + "model.json",
                URL + "metadata.json"
            );

            status.innerText = "พร้อมใช้งาน กรุณาเลือกภาพ";
        } catch (error) {
            status.innerText = "ไม่สามารถโหลดโมเดลได้ กรุณาตรวจสอบอินเทอร์เน็ต";
            console.error(error);
        }
    }

    // Select image
    document.getElementById("imageInput").addEventListener("change", function(event) {

        const file = event.target.files[0];

        if (!file) return;

        if (!file.type.startsWith("image/")) {
            alert("กรุณาเลือกไฟล์รูปภาพเท่านั้น");
            return;
        }

        selectedImage = new Image();

        const imageURL = URL.createObjectURL(file);

        selectedImage.onload = function() {

            const preview = document.getElementById("preview");

            preview.src = imageURL;
            preview.style.display = "block";

            document.getElementById("uploadBtn").disabled = false;

            document.getElementById("resultBox").style.display = "none";

            document.getElementById("status").innerText =
                "เลือกภาพเรียบร้อยแล้ว พร้อมวิเคราะห์";

        };

        selectedImage.src = imageURL;
    });

    // Upload and Predict
    async function uploadImage() {

        const status = document.getElementById("status");
        const button = document.getElementById("uploadBtn");
        const resultBox = document.getElementById("resultBox");
        const labelContainer = document.getElementById("label-container");

        if (!selectedImage || !model) {
            alert("กรุณาเลือกภาพและรอให้ระบบโหลดโมเดล");
            return;
        }

        try {

            button.disabled = true;
            button.innerText = "⏳ กำลังวิเคราะห์...";
            status.innerText = "AI กำลังประมวลผลภาพ กรุณารอสักครู่";

            // Predict image
            const prediction = await model.predict(selectedImage);

            // Sort prediction by probability
            prediction.sort((a, b) =>
                b.probability - a.probability
            );

            // Clear previous results
            labelContainer.innerHTML = "";

            // Display predictions
            prediction.forEach(item => {

                const percent = (item.probability * 100).toFixed(2);

                const div = document.createElement("div");
                div.className = "prediction";

                const info = document.createElement("div");
                info.className = "prediction-info";

                const name = document.createElement("span");
                name.textContent = item.className;

                const score = document.createElement("strong");
                score.textContent = percent + "%";

                info.appendChild(name);
                info.appendChild(score);

                const progress = document.createElement("div");
                progress.className = "progress";

                const bar = document.createElement("div");
                bar.className = "progress-bar";
                bar.style.width = percent + "%";

                progress.appendChild(bar);

                div.appendChild(info);
                div.appendChild(progress);

                labelContainer.appendChild(div);

            });

            resultBox.style.display = "block";

            status.innerText = "วิเคราะห์ภาพสำเร็จ!";

        } catch (error) {

            console.error(error);
            status.innerText = "เกิดข้อผิดพลาดในการวิเคราะห์ภาพ";

        } finally {

            button.disabled = false;
            button.innerText = "🔍 Upload & Predict";

        }
    }

    // Start loading model
    loadModel();

</script>

</body>
</html>
