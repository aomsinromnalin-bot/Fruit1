<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachable Machine - Image Classifier</title>
    <!-- นำเข้าฟอนต์ภาษาไทย Prompt จาก Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* ตั้งค่าพื้นฐานของหน้าเว็บ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        /* กล่องคอนเทนเนอร์หลัก */
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 35px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 8px;
        }

        p.subtitle {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 25px;
        }

        /* สถานะการโหลดโมเดล */
        #status-text {
            font-size: 14px;
            color: #d97706;
            background-color: #fef3c7;
            padding: 8px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: inline-block;
            font-weight: 400;
        }

        #status-text.ready {
            color: #059669;
            background-color: #d1fae5;
        }

        /* ซ่อน input file แบบเดิม แล้วตกแต่ง label เป็นปุ่มแทน */
        input[type="file"] {
            display: none;
        }

        .upload-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: #3b82f6;
            color: white;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .upload-btn:hover {
            background-color: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
        }

        .upload-btn.disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
            pointer-events: none;
            box-shadow: none;
        }

        /* กรอบแสดงรูปภาพที่อัปโหลด */
        .image-preview-box {
            margin: 25px auto;
            width: 100%;
            height: 260px;
            border: 2px dashed #cbd5e1;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #f8fafc;
            position: relative;
        }

        .image-preview-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none; /* ซ่อนไว้จนกว่าจะมีการอัปโหลดภาพ */
        }

        .placeholder-text {
            color: #94a3b8;
            font-size: 14px;
        }

        /* ส่วนแสดงผลลัพธ์การทำนาย */
        #label-container {
            margin-top: 20px;
            text-align: left;
        }

        .prediction-item {
            margin-bottom: 14px;
        }

        .prediction-header {
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #334155;
        }

        /* แถบเปอร์เซ็นต์ (Progress Bar) */
        .progress-bg {
            width: 100%;
            height: 10px;
            background-color: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: #3b82f6;
            border-radius: 10px;
            width: 0%;
            transition: width 0.4s ease;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>ระบบจำแนกรูปภาพ AI</h1>
    <p class="subtitle">อัปโหลดรูปภาพ 1 ภาพเพื่อให้โมเดลวิเคราะห์ผล</p>

    <!-- แสดงสถานะความพร้อมของโมเดล -->
    <div id="status-text">⏳ กำลังโหลดโมเดล AI กรุณารอสักครู่...</div>

    <!-- ปุ่มอัปโหลดรูปภาพ (เปิดใช้งานเมื่อโหลดโมเดลเสร็จ) -->
    <div>
        <label for="imageUpload" id="uploadLabel" class="upload-btn disabled">
            📁 เลือกรูปภาพ (Upload)
        </label>
        <input type="file" id="imageUpload" accept="image/*" onchange="handleImageUpload(event)">
    </div>

    <!-- กล่องแสดงรูปภาพตัวอย่าง -->
    <div class="image-preview-box">
        <span class="placeholder-text" id="placeholderText">ยังไม่มีรูปภาพที่เลือก</span>
        <img id="imagePreview" src="" alt="Uploaded Image">
    </div>

    <!-- พื้นที่แสดงผลลัพธ์การทำนาย -->
    <div id="label-container"></div>
</div>

<!-- นำเข้า Library ของ TensorFlow.js และ Teachable Machine -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<script type="text/javascript">
    // ลิงก์โมเดลจาก Teachable Machine ของคุณ
    const URL = "https://teachablemachine.withgoogle.com/models/Zrya_ktnG/";

    let model, labelContainer, maxPredictions;

    // 1. ฟังก์ชันโหลดโมเดลทันทีที่เปิดหน้าเว็บ
    async function loadModel() {
        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";

        try {
            // โหลดโมเดลและข้อมูลคลาส
            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            // เตรียมพื้นที่สำหรับแสดงผลลัพธ์ตามจำนวนคลาสที่มี
            labelContainer = document.getElementById("label-container");
            labelContainer.innerHTML = ""; // ล้างค่าเก่า
            
            for (let i = 0; i < maxPredictions; i++) {
                // สร้างโครงสร้าง HTML สำหรับแถบเปอร์เซ็นต์ของแต่ละคลาส
                const itemDiv = document.createElement("div");
                itemDiv.className = "prediction-item";
                itemDiv.innerHTML = `
                    <div class="prediction-header">
                        <span class="class-name">-</span>
                        <span class="class-prob">0%</span>
                    </div>
                    <div class="progress-bg">
                        <div class="progress-fill"></div>
                    </div>
                `;
                labelContainer.appendChild(itemDiv);
            }

            // อัปเดตสถานะหน้าเว็บว่าพร้อมใช้งานแล้ว และปลดล็อกปุ่มอัปโหลด
            const statusText = document.getElementById("status-text");
            statusText.innerText = "✅ โมเดลพร้อมใช้งานแล้ว";
            statusText.classList.add("ready");
            
            document.getElementById("uploadLabel").classList.remove("disabled");

        } catch (error) {
            console.error("เกิดข้อผิดพลาดในการโหลดโมเดล:", error);
            document.getElementById("status-text").innerText = "❌ โหลดโมเดลไม่สำเร็จ กรุณารีเฟรชหน้าเว็บ";
        }
    }

    // 2. ฟังก์ชันจัดการเมื่อผู้ใช้เลือกไฟล์รูปภาพ (รับได้ 1 ไฟล์)
    function handleImageUpload(event) {
        const file = event.target.files[0]; // ดึงไฟล์แรกที่ผู้ใช้เลือก
        if (!file) return; // ถ้ายกเลิกการเลือก ให้หยุดทำงาน

        const reader = new FileReader();
        
        // เมื่ออ่านไฟล์รูปภาพเสร็จสิ้น
        reader.onload = function(e) {
            const imgElement = document.getElementById("imagePreview");
            const placeholderText = document.getElementById("placeholderText");

            // นำข้อมูลภาพไปใส่ในแท็ก <img> และแสดงผล
            imgElement.src = e.target.result;
            imgElement.style.display = "block";
            placeholderText.style.display = "none";

            // รอให้รูปภาพโหลดลงในแท็ก <img> เสร็จสมบูรณ์ก่อนส่งให้ AI ทำนาย
            imgElement.onload = async function() {
                await predict(imgElement);
            };
        };

        // สั่งให้อ่านไฟล์ภาพเป็น Data URL
        reader.readAsDataURL(file);
    }

    // 3. ฟังก์ชันนำรูปภาพเข้าโมเดลเพื่อทำนายผล
    async function predict(imageElement) {
        // ส่งแท็ก <img> เข้าไปทำนายผลโดยตรง
        const prediction = await model.predict(imageElement);

        for (let i = 0; i < maxPredictions; i++) {
            const className = prediction[i].className;
            // แปลงค่าความน่าจะเป็น (0.00 - 1.00) เป็นเปอร์เซ็นต์ (0% - 100%)
            const probabilityPercent = (prediction[i].probability * 100).toFixed(1);

            // อัปเดตข้อความและแถบสีในหน้าเว็บ
            const itemDiv = labelContainer.childNodes[i];
            itemDiv.querySelector(".class-name").innerText = className;
            itemDiv.querySelector(".class-prob").innerText = probabilityPercent + "%";
            
            const progressFill = itemDiv.querySelector(".progress-fill");
            progressFill.style.width = probabilityPercent + "%";

            // เปลี่ยนสีแถบเป็นสีเขียวถ้าความมั่นใจมากกว่า 75%
            if (prediction[i].probability > 0.75) {
                progressFill.style.backgroundColor = "#10b981";
            } else {
                progressFill.style.backgroundColor = "#3b82f6";
            }
        }
    }

    // เรียกใช้ฟังก์ชันโหลดโมเดลทันทีที่เปิดหน้าเว็บ
    window.onload = loadModel;
</script>

</body>
</html>
